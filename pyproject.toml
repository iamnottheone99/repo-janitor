[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-janitor"
version = "0.1.0"
description = "Autonomous local Ollama-powered repository maintainer using isolated git worktrees"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "GitPython>=3.1.40",
    "ollama>=0.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
treesitter = [
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
janitor = "repo_janitor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
